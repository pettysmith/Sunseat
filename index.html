<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunseat</title>
  <meta name="description" content="Sonnen-Karte: wo in der Stadt gerade Sonne auf den Boden fällt.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunseat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" class="map"></div>

  <header class="top">
    <div class="brand">Sunseat</div>
    <button id="locate" class="square" type="button" aria-label="Mein Standort">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5" fill="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
    </button>
  </header>

  <p id="notice" class="notice" hidden></p>

  <section class="panel" aria-label="Zeit">
    <nav id="days" class="days" aria-label="Tag"></nav>
    <div class="row">
      <output id="time" class="time">–</output>
      <span id="sun" class="meta"></span>
      <button id="now" class="link" type="button" hidden>Jetzt</button>
    </div>
    <input id="slider" class="slider" type="range" min="0" max="100" value="0" step="1" aria-label="Uhrzeit">
    <div class="ends"><span id="rise"></span><span id="set"></span></div>
    <div class="legend">
      <span><i class="sw sw-sun"></i>Sonne am Boden</span>
      <span><i class="sw sw-shade"></i>Schatten und Dächer</span>
      <span id="cloud" class="meta"></span>
    </div>
  </section>

  <script src="vendor/suncalc.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
